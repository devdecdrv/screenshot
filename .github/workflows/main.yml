name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: ./ScreenCapServer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.6 --distribution-type bin
          chmod +x gradlew

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore app/release.keystore \
            -alias deckey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass decpass123 \
            -keypass decpass123 \
            -dname "CN=Dec,OU=Dev,O=Dec,L=IN,S=IN,C=IN" \
            -noprompt

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASS: decpass123
          KEY_ALIAS:     deckey
          KEY_PASS:      decpass123

      - name: Get version info
        id: ver
        run: |
          NAME=$(grep versionName app/build.gradle | grep -oP '(?<=")[^"]+' | head -1)
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.sha }}
          name: "SysService v${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.sha }})"
          body: |
            Commit: ${{ github.sha }}
            ${{ github.event.head_commit.message }}
          files: ScreenCapServer/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
